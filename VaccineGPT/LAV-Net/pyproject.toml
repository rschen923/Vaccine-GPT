[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lav-net"
version = "0.1.0"
description = "Evidence-aware attenuation target ranking for live attenuated vaccine design"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "torch>=2.1"
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["lavnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

